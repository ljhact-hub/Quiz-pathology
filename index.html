<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임상병리 퀴즈</title>
    <meta name="description" content="임상병리 국가고시 대비 퀴즈 앱">
    <meta name="theme-color" content="#87CEEB">
    
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="app-container">
        <div id="loading-screen" class="screen active">
            <h2>퀴즈 데이터를 불러오는 중...</h2>
            <p id="error-message" style="color: red;"></p>
        </div>
        
        <div id="main-menu-screen" class="screen"></div>
        
        <div id="num-select-screen" class="screen"></div>
        
        <div id="custom-num-screen" class="screen"></div>
        
        <div id="quiz-screen" class="screen">
            <div id="timer-display"></div>
            <div id="quiz-content-wrapper"></div>
        </div>
        
        <div id="results-screen" class="screen"></div>

        <div id="problem-list-screen" class="screen"></div>

        <div id="stats-screen" class="screen"></div>
    </div>
    <footer>
        문제 오류, 이의신청 환영 ljhact@gmail.com or 010-2453-6712
    </footer>
</body>
</html>
